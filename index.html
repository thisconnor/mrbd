<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="mrbd-web-app-capable" content="yes">
<title>MRBD Apps</title>
<link rel="icon" href="data:,">
<style>
  /* ————————————————————————————————————————————————————————————————
     MRBD launcher — the hub, rebuilt as an on-glasses app so one
     installed link opens every app in the playground. Reads apps.json
     at load, so new apps appear without reinstalling anything.
     Instrument style: transparent #000 canvas, hairline strokes, white
     ink, arrows to move, pinch (Enter) to open.
     ———————————————————————————————————————————————————————————————— */
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; color:#fff;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro",
                 "Helvetica Neue", system-ui, sans-serif;
    font-weight:300;
    user-select:none; -webkit-user-select:none;
    display:grid; place-items:center;
  }
  button { font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; text-align:left; }
  .hidden { display:none !important; }

  /* Cap at the display's 600x600 but shrink to the runtime viewport if it
     reports smaller, so nothing ever lands outside the visible panel. The
     36px inset keeps rows clear of the FOV's vignetted rim. */
  .stage {
    position:relative;
    width:600px; height:600px;
    width:min(600px, 100vw); height:min(600px, 100dvh);
    padding:28px 36px 18px;
    display:flex; flex-direction:column;
  }

  header {
    display:flex; align-items:baseline; justify-content:space-between;
    padding:0 4px 10px;
    flex-shrink:0;
  }
  .brand {
    font-size:15px; font-weight:600; letter-spacing:0.34em;
    opacity:0.9;
  }
  .count {
    font-size:11px; font-weight:500; letter-spacing:0.2em;
    opacity:0.4; text-transform:uppercase;
    font-variant-numeric:tabular-nums;
  }

  /* ——— app list (windowed: translates to keep focus visible) ——— */
  .viewport { position:relative; flex:1; overflow:hidden; }
  .list {
    display:flex; flex-direction:column; gap:9px;
    padding:6px 0;
    transition:transform 180ms ease;
  }
  .app-row {
    display:flex; align-items:center; gap:18px;
    min-height:86px;
    padding:0 22px 0 18px;
    border:1.25px solid rgba(255,255,255,0.22);
    border-radius:18px;
    flex-shrink:0;
    transition:border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
  }
  .app-row .icon {
    width:46px; height:46px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0.85;
  }
  .app-row .icon svg {
    width:40px; height:40px;
    stroke:#fff; fill:none;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
  }
  .app-row .mono {
    width:40px; height:40px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.85);
    display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:400;
  }
  .app-row .txt { flex:1; min-width:0; opacity:0.8; transition:opacity 140ms ease; }
  .app-row .name {
    display:block;
    font-size:21px; font-weight:400; letter-spacing:0.01em; line-height:1.2;
  }
  .app-row .desc {
    display:block;
    font-size:13px; opacity:0.55; line-height:1.3; margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .app-row .chev {
    font-size:26px; font-weight:300; opacity:0.25;
    transition:opacity 140ms ease;
    flex-shrink:0;
  }
  /* No scale on focus: a scaled full-width row pokes past the safe inset
     and reads as clipped on the glasses. The ring + fill carries it. */
  .app-row.foc {
    border-color:rgba(255,255,255,0.95);
    background:rgba(255,255,255,0.07);
    box-shadow:0 0 16px rgba(255,255,255,0.15);
  }
  .app-row.foc .txt, .app-row.foc .icon { opacity:1; }
  .app-row.foc .chev { opacity:0.8; }

  /* scroll scrims (only shown when the list overflows) */
  .scrim {
    position:absolute; left:0; right:0; height:44px; z-index:2;
    pointer-events:none;
  }
  .scrim.top { top:0; background:linear-gradient(#000, transparent); }
  .scrim.bottom { bottom:0; background:linear-gradient(transparent, #000); }

  /* status card (loading / fetch error) */
  .status {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    text-align:center; padding:0 40px;
  }
  .status .s-title { font-size:24px; font-weight:300; letter-spacing:-0.01em; }
  .status .s-sub { font-size:14px; opacity:0.55; line-height:1.5; max-width:420px; }
  .status code {
    font:inherit; font-size:13px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:6px; padding:1px 7px;
  }

  footer {
    flex-shrink:0; text-align:center;
    padding:10px 0 0;
    font-size:11px; font-weight:500; letter-spacing:0.22em;
    opacity:0.4; text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="brand">MRBD</div>
    <div class="count" id="count"></div>
  </header>

  <div class="viewport" id="viewport">
    <div class="list" id="list"></div>
    <div class="scrim top hidden" id="scrimTop"></div>
    <div class="scrim bottom hidden" id="scrimBottom"></div>
  </div>

  <footer id="hint">Swipe ↑ ↓ · Pinch to open</footer>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const els = {
    list: $('list'), viewport: $('viewport'), count: $('count'),
    scrimTop: $('scrimTop'), scrimBottom: $('scrimBottom'), hint: $('hint'),
  };

  // Thin-stroke line icons keyed by app id; unknown apps fall back to a
  // ringed monogram, so future apps.json entries need no hub changes.
  const ICONS = {
    poker:
      '<svg viewBox="0 0 48 48"><path d="M24 6c-5.5 8.5-13.5 12.5-13.5 20.5a7.2 7.2 0 0 0 12.2 5.2C22.2 36 20.5 38.5 17.5 41h13c-3-2.5-4.7-5-5.2-9.3a7.2 7.2 0 0 0 12.2-5.2C37.5 18.5 29.5 14.5 24 6z"/></svg>',
    'drive-hud':
      '<svg viewBox="0 0 48 48"><path d="M8.5 31a16 16 0 1 1 31 0"/><line x1="24" y1="31" x2="32.5" y2="20"/><circle cx="24" cy="31" r="2.6"/></svg>',
    trending:
      '<svg viewBox="0 0 48 48"><rect x="7" y="11" width="34" height="26" rx="5"/><path d="M20.5 18.5v11l9.5-5.5z"/></svg>',
    'hello-hud':
      '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16.5"/><path d="M24 14.5V24l6.5 4"/></svg>',
    'glance-cards':
      '<svg viewBox="0 0 48 48"><rect x="15.5" y="7.5" width="24" height="30" rx="4" opacity="0.45"/><rect x="8.5" y="12.5" width="24" height="30" rx="4"/></svg>',
  };
  const iconFor = (app) => ICONS[app.id] ||
    '<span class="mono">' + (app.name || '?').trim().charAt(0).toUpperCase() + '</span>';

  const state = { apps: [], focus: 0 };
  const rows = [];

  function showStatus(title, subHtml) {
    els.list.innerHTML =
      '<div class="status"><div class="s-title">' + title + '</div>' +
      '<div class="s-sub">' + subHtml + '</div></div>';
    els.list.style.transform = '';
    els.hint.classList.add('hidden');
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
    })[c]);
  }

  function buildRows() {
    els.list.innerHTML = '';
    rows.length = 0;
    state.apps.forEach((app, i) => {
      const b = document.createElement('button');
      b.className = 'app-row';
      b.innerHTML =
        '<span class="icon">' + iconFor(app) + '</span>' +
        '<span class="txt"><span class="name">' + esc(app.name) + '</span>' +
        '<span class="desc">' + esc(app.description || '') + '</span></span>' +
        '<span class="chev">›</span>';
      b.addEventListener('click', () => { state.focus = i; open(); });
      els.list.appendChild(b);
      rows.push(b);
    });
    els.count.textContent = state.apps.length + (state.apps.length === 1 ? ' app' : ' apps');
    render();
  }

  function open() {
    const app = state.apps[state.focus];
    if (app) location.href = app.path;
  }

  function move(step) {
    if (!rows.length) return;
    state.focus = (state.focus + step + rows.length) % rows.length;
    render();
  }

  function render() {
    rows.forEach((r, i) => r.classList.toggle('foc', i === state.focus));

    // keep the focused row inside the viewport; scrims signal overflow
    const vh = els.viewport.clientHeight;
    const lh = els.list.scrollHeight;
    let offset = 0;
    if (lh > vh && rows.length) {
      const r = rows[state.focus];
      const top = r.offsetTop, bottom = top + r.offsetHeight;
      const margin = 14;
      const current = -offsetOf();
      let target = current;
      if (top - margin < current) target = top - margin;
      else if (bottom + margin > current + vh) target = bottom + margin - vh;
      offset = -Math.max(0, Math.min(target, lh - vh));
    }
    els.list.style.transform = offset ? 'translateY(' + offset + 'px)' : '';
    const showScrims = lh > vh;
    els.scrimTop.classList.toggle('hidden', !(showScrims && offset < 0));
    els.scrimBottom.classList.toggle('hidden', !(showScrims && lh + offset > vh + 1));
  }
  function offsetOf() {
    const t = els.list.style.transform;
    const m = t && t.match(/-?[\d.]+/);
    return m ? parseFloat(m[0]) : 0;
  }

  // ——— input: glasses send arrows + Enter; desktop/touch get the same ———
  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'ArrowLeft': e.preventDefault(); move(-1); break;
      case 'ArrowDown': case 'ArrowRight': e.preventDefault(); move(1); break;
      case 'Enter': case ' ': e.preventDefault(); open(); break;
    }
  });
  let ty = 0, tracking = false;
  document.addEventListener('touchstart', (e) => {
    ty = e.changedTouches[0].clientY; tracking = true;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dy) > 30) move(dy > 0 ? -1 : 1);
    else if (!e.target.closest('button')) open();
  }, { passive: true });

  // ——— load the registry ———
  showStatus('Loading…', 'Reading the app registry.');
  fetch('./apps.json')
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(({ apps }) => {
      if (!apps || !apps.length) {
        showStatus('No apps yet',
          'Scaffold one with <code>npm run new -- "My first app"</code>.');
        return;
      }
      state.apps = apps;
      els.hint.classList.remove('hidden');
      buildRows();
    })
    .catch(() => {
      showStatus("Can't load apps.json",
        'Open this page through a server: run <code>npm run dev</code> and visit ' +
        '<code>http://localhost:8000</code> (file:// blocks fetch).');
    });
})();
</script>
</body>
</html>
